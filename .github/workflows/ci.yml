name: CI

on:
  push:
    branches:
      - main
      - 'step0/**'
  pull_request:
    branches:
      - main

jobs:
  web:
    name: Web (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

  ml:
    name: ML (Ruff, Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest numpy

      - name: Run ruff check
        run: ruff check .

      - name: Run pytest
        run: python -m pytest
